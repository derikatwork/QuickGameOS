name: check

# Validity gate for the flake. Two independent jobs:
#   - evaluate: fully *evaluates* both the installed-system and ISO configs
#               (catches bad option names, typos and missing package attrs)
#               without building the whole world. This is the real gate.
#   - format:   reports nixpkgs-fmt style diffs, but is non-blocking (run
#               `nix fmt` locally to normalize).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate the installed system config
        run: |
          nix eval --raw \
            .#nixosConfigurations.quickgameos.config.system.build.toplevel.drvPath

      - name: Evaluate the live ISO config
        run: |
          nix eval --raw \
            .#nixosConfigurations.iso.config.system.build.isoImage.drvPath

  format:
    runs-on: ubuntu-latest
    # Style feedback only - never blocks the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check formatting (nixpkgs-fmt)
        run: nix run nixpkgs#nixpkgs-fmt -- --check .
